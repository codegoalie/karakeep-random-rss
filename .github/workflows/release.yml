name: Release

# Builds the root Dockerfile and publishes it to GHCR whenever a version tag
# is pushed (via `git tag vX.Y.Z && git push --tags`), or on demand via
# workflow_dispatch. For real tag pushes, it then commits the version bump that
# actually triggers a deploy — see the bump-deployed-version job below — so
# tagging is the only manual step in a release.
#
# linux/amd64 only: percival, the only host this image is deployed to, is
# amd64. Add another platform to the build-push-action `platforms:` input if
# that ever changes. The homelab convention keeps the v prefix for image tags
# (e.g., :vX.Y.Z).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/codegoalie/karakeep-random-rss

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags/labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # {{raw}}, not {{version}}: {{version}} normalizes semver and
          # strips the leading `v`, publishing :0.1.0 for tag v0.1.0. The
          # homelab convention keeps the prefix (e.g., :vX.Y.Z), and the
          # deploy/percival/docker-compose.yml references this tag format.
          # A `latest` tag is added too, via the default flavor latest=auto.
          tags: |
            type=semver,pattern={{raw}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bump-deployed-version:
    # Ordering matters here: dockhand treats a commit that changes
    # deploy/percival/karakeep-random-rss.env as "deploy this version" (see
    # deploy/README.md). If this job ran before build-and-push finished —
    # or in parallel and won the race — dockhand's next poll could try to
    # pull a tag that GHCR doesn't have yet. `needs:` forces the image to
    # exist first.
    needs: build-and-push
    runs-on: ubuntu-latest
    # workflow_dispatch runs have no version tag: github.ref is a branch
    # ref (e.g. refs/heads/main), not refs/tags/vX.Y.Z, so there is no
    # version to bump to. Only run this for an actual `vX.Y.Z` tag push.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      # Scoped to this job only, rather than widening the workflow-level
      # `permissions:` block above — build-and-push never needs to write
      # to the repo, only to GHCR.
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          # A tag-triggered run's default checkout lands on the tag's
          # commit in detached HEAD, which has nothing to push to. The
          # version bump is a commit on main, so check that out
          # explicitly instead of relying on the default ref.
          ref: main

      - name: Bump KARAKEEP_RANDOM_RSS_VERSION
        run: ./scripts/bump-deployed-version.sh "${{ github.ref_name }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # bump-deployed-version.sh is idempotent: if the file was
          # already at this version (e.g. a re-run after a prior
          # successful bump), it made no change. Committing nothing would
          # fail, so check first and exit cleanly instead.
          if git diff --quiet; then
            echo "No changes to commit; already at ${{ github.ref_name }}."
            exit 0
          fi

          git add deploy/percival/karakeep-random-rss.env
          git commit -m "chore(deploy): release ${{ github.ref_name }}"

          # Rebase before pushing so a concurrent push to main (unrelated
          # to this release) doesn't make this push fail outright.
          git pull --rebase origin main
          git push origin HEAD:main

          # Note: this push cannot re-trigger this workflow. The trigger
          # above is `on.push.tags`, and this pushes a commit to the main
          # branch, not a tag — so there's no risk of a redeploy loop.
